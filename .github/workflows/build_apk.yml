name: Build WonderDraw Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Flutter SDK kur (stable kanal)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Flutter sürümünü yazdır
        run: flutter --version

      - name: android/ platformu yoksa oluştur
        run: |
          if [ ! -d "android" ]; then
            echo "android/ klasörü yok, oluşturuluyor..."
            flutter create --platforms=android --org com.wonderdraw .
          else
            echo "android/ zaten mevcut, oluşturma adımı atlanıyor."
          fi

      - name: lib/ ve pubspec.yaml dokunulmadan kaldı mı doğrula
        run: |
          if [ -n "$(git status --porcelain lib pubspec.yaml)" ]; then
            echo "HATA: flutter create, lib/ veya pubspec.yaml dosyalarını değiştirdi."
            git diff lib pubspec.yaml
            exit 1
          fi
          echo "OK: lib/ ve pubspec.yaml değişmedi."

      - name: Bağımlılıkları indir
        run: flutter pub get

      - name: Kod kontrolü — reaction.dart ve widget_test.dart içeriğini göster
        run: |
          echo "=== REACTION SPEC ==="
          grep -A12 "class ReactionSpec" lib/models/reaction.dart

          echo "=== WIDGET TEST ==="
          sed -n '1,80p' test/widget_test.dart

      - name: reaction.dart içinde eski assert kalmadığını doğrula
        run: |
          if grep -q "assert(" lib/models/reaction.dart; then
            echo "ERROR: reaction.dart içinde assert kaldı."
            exit 1
          fi
          echo "OK: reaction.dart temiz."

      - name: widget_test.dart içinde eski MyApp kalmadığını doğrula
        run: |
          if grep -q "MyApp" test/widget_test.dart; then
            echo "ERROR: widget_test.dart içinde eski MyApp testi kaldı."
            exit 1
          fi
          echo "OK: widget_test.dart temiz."

      - name: Statik analiz
        run: flutter analyze--no-fatal-infos

      - name: Debug APK oluştur
        run: flutter build apk --debug

      - name: APK dosyasının gerçekten oluştuğunu doğrula
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "HATA: APK bulunamadı: $APK_PATH"
            exit 1
          fi
          echo "OK: APK bulundu -> $APK_PATH ($(du -h "$APK_PATH" | cut -f1))"

      - name: Package ID'yi doğrula (com.wonderdraw.wonderdraw bekleniyor)
        run: |
          EXPECTED="com.wonderdraw.wonderdraw"
          ACTUAL=$(grep -oE 'applicationId[[:space:]]*=?[[:space:]]*"[^"]+"' android/app/build.gradle* \
            | grep -oE '"[^"]+"' | tr -d '"' | head -n1)
          echo "Beklenen: $EXPECTED"
          echo "Bulunan:  $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "HATA: Package ID beklenenle eşleşmiyor."
            exit 1
          fi
          echo "OK: Package ID doğrulandı."

      - name: APK'yı artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: wonderdraw-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
