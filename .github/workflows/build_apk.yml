name: Build WonderDraw Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Extract WonderDraw project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: WonderDraw ZIP file bulunamadı."
            exit 1
          fi

          echo "ZIP bulundu: $ZIP_FILE"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          echo "ZIP içeriği:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Locate Flutter project
        shell: bash
        run: |
          set -e

          PUBSPEC=$(find extracted -name "pubspec.yaml" -type f | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml bulunamadı."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Flutter proje dizini: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check project files
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Flutter proje içeriği:"
          ls -la

          echo ""
          echo "pubspec.yaml:"
          test -f pubspec.yaml

          echo ""
          echo "lib klasörü:"
          test -d lib

      - name: Create Android platform
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ ! -d "android" ]; then
            echo "android klasörü yok. Flutter Android platformu oluşturuluyor..."

            flutter create \
              --platforms=android \
              --org com.wonderdraw \
              .

          else
            echo "android klasörü zaten mevcut."
          fi

      - name: Verify source files were not changed
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "lib ve pubspec.yaml değişiklik kontrolü..."

          if git diff --quiet -- lib pubspec.yaml; then
            echo "OK: lib ve pubspec.yaml değişmemiş."
          else
            echo "ERROR: flutter create mevcut kaynak dosyalarda değişiklik yaptı!"
            git diff -- lib pubspec.yaml
            exit 1
          fi

      - name: Verify Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -d android
          test -f android/app/src/main/AndroidManifest.xml

          echo "Android proje yapısı mevcut."

      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Flutter analyze
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze

      - name: Verify package ID
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          EXPECTED="com.wonderdraw.wonderdraw"

          APPLICATION_ID=$(grep -R "applicationId" android/app \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            | head -n 1 \
            | sed -E 's/.*applicationId[^"]*"([^"]+)".*/\1/' \
            || true)

          echo "Bulunan applicationId: $APPLICATION_ID"
          echo "Beklenen applicationId: $EXPECTED"

          if [ "$APPLICATION_ID" != "$EXPECTED" ]; then
            echo "ERROR: Package ID beklenen değerle eşleşmiyor."
            exit 1
          fi

          echo "Package ID OK."

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --debug

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK oluşturulamadı."
            exit 1
          fi

          echo "APK başarıyla oluşturuldu."
          ls -lh "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wonderdraw-debug-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
