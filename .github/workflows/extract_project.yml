name: Extract WonderDraw Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract WonderDraw ZIP
        shell: bash
        run: |
          set -e

          ZIP="wonderdraw_fix1.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP bulunamadı."
            exit 1
          fi

          rm -rf /tmp/wonderdraw_extract
          mkdir -p /tmp/wonderdraw_extract

          unzip -q "$ZIP" -d /tmp/wonderdraw_extract

          echo "ZIP içeriği:"
          find /tmp/wonderdraw_extract -maxdepth 3 -type f | sort

          ROOT="/tmp/wonderdraw_extract"

          if [ -d "$ROOT/wonderdraw" ]; then
            ROOT="$ROOT/wonderdraw"
          fi

          echo "Proje kökü: $ROOT"

          # ZIP'in kendi GitHub Actions dosyalarını KOPYALAMIYORUZ.
          # Repository'deki mevcut build_apk.yml korunacak.
          rm -rf "$ROOT/.github"

          # ZIP dosyalarını da projeye tekrar koyma.
          find "$ROOT" -type f -name "*.zip" -delete

          echo "Projeyi repository ana dizinine kopyalıyorum..."

          cp -a "$ROOT"/. .

          echo "Kontrol:"
          test -d lib
          test -f pubspec.yaml
          test -f lib/main.dart

          echo "Proje dosyaları başarıyla çıkarıldı."

      - name: Verify important files
        shell: bash
        run: |
          set -e

          echo "lib:"
          find lib -maxdepth 2 -type f | sort | head -100

          echo
          echo "pubspec.yaml:"
          test -f pubspec.yaml

          echo
          echo "Existing build workflow:"
          test -f .github/workflows/build_apk.yml

          echo
          echo "Kontroller başarılı."

      - name: Commit extracted project
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Commit edilecek değişiklik yok."
            exit 0
          fi

          git commit -m "chore: extract WonderDraw project"

          git push origin HEAD:main
